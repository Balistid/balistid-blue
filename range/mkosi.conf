# Range base image (ADR 0009). The snapshot pins every package, including the kernel that
# rangevm.TargetKernel names; change both together. laurel comes from packaging/laurel (ADR 0004).
[Distribution]
Distribution=arch
Snapshot=2026/10/02

[Output]
Format=disk
ManifestFormat=json
Seed=63547e22-c6e0-42b4-af70-48ddec61cb69

[Content]
Packages=linux
         systemd
         audit
         laurel
Bootable=yes
Bootloader=systemd-boot
SourceDateEpoch=1790899200
# The Arch preset disables every unit, so the ones the range needs are started from the command line.
KernelCommandLine=console=ttyS0 systemd.firstboot=off systemd.wants=auditd.service
                  systemd.wants=audit-rules.service systemd.wants=kordon-range-guest.service
