# Range base image (ADR 0009). The snapshot pins every package, including the kernel that
# rangevm.TargetKernel names; change both together. laurel comes from packaging/laurel (ADR 0004).
[Distribution]
Distribution=arch
Snapshot=2026/10/02

[Output]
Format=disk
ManifestFormat=json
Seed=63547e22-c6e0-42b4-af70-48ddec61cb69

[Content]
# audit does not depend on gawk, but augenrules needs awk; without it the rules unit loads an
# empty rule set and still succeeds (found by the first sensor smoke test, 2026-10-03).
Packages=linux
         systemd
         audit
         gawk
         laurel
         e2fsprogs
Bootable=yes
Bootloader=systemd-boot
SourceDateEpoch=1790899200
# The Arch preset disables every unit, so the ones the range needs are started from the command line.
# audit=1 gives every process an audit context from boot; without it processes started before
# auditd are never audited. Until auditd runs, records wait in a kernel queue of 64 by default, which
# lost 180 records in a run (2026-10-03), so the boot-time limit is large enough to lose nothing.
KernelCommandLine=console=ttyS0 audit=1 audit_backlog_limit=65536 systemd.firstboot=off
                  systemd.wants=auditd.service
                  systemd.wants=audit-rules.service systemd.wants=balistid-collector.service
                  systemd.wants=balistid-ledger.service systemd.wants=balistid-relay.service
                  systemd.wants=balistid-range-guest.service
