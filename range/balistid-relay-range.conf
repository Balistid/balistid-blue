# Range image only (ADR 0026, point 5): the relay submits to the pinned litewitness in the Pi's namespace
# through the tunnel and serves bundles to the Pi's stand-in there (ADR 0031, 0032). Argv and the sandbox
# are the installed ones.
[Unit]
Requires=balistid-range-witness.service
After=balistid-range-witness.service
