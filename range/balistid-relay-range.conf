# Range image only (ADR 0026, point 5): the relay submits to the pinned litewitness in the VM, on
# 127.0.0.1, instead of the Pi the install names, and serves bundles there to the Pi's stand-in (ADR 0031).
# Argv and the sandbox are the installed ones.
[Unit]
Requires=balistid-range-witness.service
After=balistid-range-witness.service

[Service]
EnvironmentFile=
Environment=BALISTID_WITNESS_URL=http://127.0.0.1:7380/add-checkpoint BALISTID_RELAY_LISTEN=127.0.0.1:7381
IPAddressAllow=localhost
