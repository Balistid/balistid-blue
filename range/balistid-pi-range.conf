# Range image only (ADR 0031): the Pi's watcher stands in for the Pi in the VM, against the pinned
# litewitness and the relay on 127.0.0.1, with a token made up for the range and no ntfy behind it.
# Argv and the sandbox are the Pi's.
[Unit]
Requires=balistid-range-witness.service balistid-relay.service
After=balistid-range-witness.service balistid-relay.service

[Service]
EnvironmentFile=
Environment=BALISTID_PI_ORIGIN=balistid-range/log BALISTID_PI_WITNESS=http://127.0.0.1:7380/
Environment=BALISTID_PI_RELAY=http://127.0.0.1:7381/ BALISTID_PI_NTFY=http://127.0.0.1:7382/balistid-range
SetCredential=ntfy-token:range-only
