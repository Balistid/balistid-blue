# Range image only (ADR 0031): the Pi's watcher stands in for the Pi in its namespace (ADR 0032), against the
# pinned litewitness there and the relay through the tunnel, with a token made up for the range and the range's
# ntfy sink behind it (ADR 0036). The sandbox is the Pi's, the argv too but for a shorter quiet cap (ADR 0036).
[Unit]
# Wants, not Requires, the relay: an alarm trial stops the host's units, and a Pi does not stop with them (ADR 0036).
Requires=balistid-range-pi-net.service balistid-range-witness.service balistid-range-ntfy.service
Wants=balistid-relay.service
After=balistid-range-pi-net.service balistid-range-witness.service balistid-relay.service balistid-range-ntfy.service

[Service]
NetworkNamespacePath=/run/netns/balistid-pi
EnvironmentFile=
Environment=BALISTID_PI_ORIGIN=balistid-range/log BALISTID_PI_WITNESS=http://10.207.57.2:7380/
Environment=BALISTID_PI_RELAY=http://10.207.57.1:7381/ BALISTID_PI_NTFY=http://127.0.0.1:7382/balistid-range
SetCredential=ntfy-token:range-only
ExecStart=
ExecStart=/usr/local/lib/balistid/balistid-pi -origin ${BALISTID_PI_ORIGIN} -witness ${BALISTID_PI_WITNESS} -relay ${BALISTID_PI_RELAY} -ntfy ${BALISTID_PI_NTFY} -quiet 20m
