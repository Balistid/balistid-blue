# Range image only (ADR 0022, point 2), never on a host: the store on the run's scratch disk, a reserve
# that fits it, and the commit line the guest reads at its barrier. Argv is otherwise the installed one.
[Unit]
Requires=balistid-range-store.service
After=balistid-range-store.service

[Service]
ExecStart=
ExecStart=/usr/local/lib/balistid/balistid-collector -store /var/lib/balistid-range/scratch/store -canary /var/lib/balistid/collector/canary -rule-version adr-0004-v1 -headroom 67108864 -log-commits
ReadWritePaths=/var/lib/balistid-range/scratch/store
