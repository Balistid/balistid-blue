# Range image only (ADR 0022, point 2), never on a host: the store on the run's scratch disk, a reserve
# that fits it, and the commit line the guest reads at its barrier. Argv is otherwise the installed one.
# The keys the range makes in the VM come first: the collector reads them at start (ADR 0029).
[Unit]
Requires=balistid-range-store.service balistid-range-witness-key.service
After=balistid-range-store.service balistid-range-witness-key.service

[Service]
ExecStart=
ExecStart=/usr/local/lib/balistid/balistid-collector -store /var/lib/balistid-range/scratch/store -canary /var/lib/balistid/collector/canary -rule-version adr-0004-v2 -headroom 67108864 -log-commits \
  -cpuprofile /var/lib/balistid/collector/cpu.prof
ReadWritePaths=/var/lib/balistid-range/scratch/store
# Like the base unit's, the mount systemd adds for a writable path skips the noexec of /.
NoExecPaths=/var/lib/balistid-range/scratch/store
