# Range image only (ADR 0027): the ledger waits for the keys the range makes in the VM, the witness's
# too, which it reads at start to verify the relay's cosigned checkpoint (ADR 0029). Argv and the
# sandbox are the installed ones.
[Unit]
Requires=balistid-range-ledger-key.service balistid-range-witness-key.service
After=balistid-range-ledger-key.service balistid-range-witness-key.service
