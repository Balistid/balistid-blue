# Range image only (ADR 0027): the ledger waits for the keys the range makes in the VM, the witness's
# too, which it reads at start to verify the relay's cosigned checkpoint (ADR 0029). The sandbox is the
# installed one, the argv too but for the cap, the installed one unless the log-cap trial lowers it (ADR 0036).
[Unit]
Requires=balistid-range-ledger-key.service balistid-range-witness-key.service
After=balistid-range-ledger-key.service balistid-range-witness-key.service

[Service]
Environment=BALISTID_RANGE_LEDGER_CAP=10737418240
ExecStart=
ExecStart=/usr/local/lib/balistid/balistid-ledger -log /var/lib/balistid/ledger/log -socket /run/balistid-ledger/ledger.sock -cap-bytes ${BALISTID_RANGE_LEDGER_CAP}
