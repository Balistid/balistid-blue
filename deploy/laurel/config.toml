# Laurel for Balistid Blue floor 0 (ADR 0004): the v0.8.2 example configuration without its sample process
# labels. Laurel drops root to _laurel and keeps only CAP_SYS_PTRACE and CAP_DAC_READ_SEARCH, and writes
# its records to the collector's socket (ADR 0016), not a log: v0.8.2 rotates only a file, so size and
# generations are gone. Installed only by balistid-install.
# Experiment (exp/cpu-path): no environment, cgroup or group lookups per event; pid, spawned-by and
# script stay for the process tree and interpreters.
directory = "/var/log/laurel"
user = "_laurel"
statusreport-period = 0
input = "stdin"

[auditlog]
file = "unix:/run/balistid/collector.sock"

[state]
file = "state"
generations = 0
max-age = 60

[transform]
execve-argv = [ "array" ]

[translate]
universal = false
user-db = false
drop-raw = false

[enrich]
pid = true
ppid-verbose = false
spawned-by = true
execve-env = [ ]
container = false
container_info = false
systemd = false
script = true
user-groups = false

[filter]
filter-null-keys = false
filter-action = "drop"
