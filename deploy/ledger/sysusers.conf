# The ledger's own uid, without privilege or network (ADR 0007).
u balistid-ledger - "Balistid Blue ledger"
# The relay's group, made here as well, so the ledger starts even before the relay is installed.
g balistid-relay -
# The ledger socket's group (ADR 0060); the collector's sysusers makes it too. No member: only the two units
# take it, as SupplementaryGroups.
g balistid-ledgerlink -
