# Only the relay's uid reaches the Pi (ADR 0006 point 2, ADR 0032); balistid-net loads this before the tunnel
# exists. The tunnel's addresses, port and mark are fixed (ADR 0032); PI_ENDPOINT, the Pi's LAN address, is
# defined by the unit from the install's net.env. Each refusal is logged with the table's version and its
# reason, the sender's uid where one sent it, at most 10 a minute per reason; its counter keeps every one.
define PI = 10.207.57.2
define HOST = 10.207.57.1
define WG_PORT = 51820
define WG_MARK = 0x4a1d
define RELAY_CT = 0x4a1e
define RELAY_PORT = 7381

table inet balistid
delete table inet balistid
table inet balistid {
    chain output {
        type filter hook output priority filter; policy accept;
        ip daddr $PI meta l4proto tcp meta skuid "balistid-relay" ct mark set $RELAY_CT accept
        # A connection's last packets, sent once the relay closed its socket, carry no uid but its mark.
        ip daddr $PI meta l4proto tcp ct state established ct mark $RELAY_CT accept
        ip daddr $PI limit rate 10/minute log prefix "balistid-net 1 to-pi-not-relay: " level warn flags skuid
        ip daddr $PI counter drop
        ip daddr $PI_ENDPOINT meta mark $WG_MARK udp sport $WG_PORT udp dport $WG_PORT accept
        ip daddr $PI_ENDPOINT limit rate 10/minute log prefix "balistid-net 1 to-endpoint-not-wireguard: " level warn flags skuid
        ip daddr $PI_ENDPOINT counter drop
    }
    chain input {
        type filter hook input priority filter; policy accept;
        iifname "balistid0" ct state established accept
        iifname "balistid0" ip saddr $PI ip daddr $HOST tcp dport $RELAY_PORT accept
        iifname "balistid0" limit rate 10/minute log prefix "balistid-net 1 from-tunnel-not-relay-port: " level warn
        iifname "balistid0" counter drop
        ip saddr $PI limit rate 10/minute log prefix "balistid-net 1 pi-address-off-tunnel: " level warn
        ip saddr $PI counter drop
        ip daddr $HOST limit rate 10/minute log prefix "balistid-net 1 host-address-off-tunnel: " level warn
        ip daddr $HOST counter drop
    }
    chain forward {
        type filter hook forward priority filter; policy accept;
        iifname "balistid0" limit rate 10/minute log prefix "balistid-net 1 forward-from-tunnel: " level warn
        iifname "balistid0" counter drop
        oifname "balistid0" limit rate 10/minute log prefix "balistid-net 1 forward-to-tunnel: " level warn
        oifname "balistid0" counter drop
        ip daddr { $PI, $PI_ENDPOINT } limit rate 10/minute log prefix "balistid-net 1 forward-to-pi: " level warn
        ip daddr { $PI, $PI_ENDPOINT } counter drop
    }
}
