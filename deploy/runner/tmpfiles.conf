# Directories of the range runner (ADR 0011, point 5). No age: the runner prunes its own results (R5).
# The install also creates /var/lib/balistid/inbox and /var/lib/balistid/objects, owned by the
# maintainer, group balistid-runner, mode 2750; they are not here because they name the maintainer.
d /var/lib/balistid 0755 root root -
d /var/lib/balistid/results 0750 balistid-runner balistid-agents -
# NewResultDir refuses anything but a 2750 directory the runner owns; setgid hands results to agents.
d /var/lib/balistid/results/agent 2750 balistid-runner balistid-agents -
d /var/lib/balistid/results/evidence 2750 balistid-runner balistid-agents -
d /var/lib/balistid/results/acceptance 2750 balistid-runner balistid-agents -
