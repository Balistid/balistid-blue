# Directories of the collector (ADR 0016, 0017). systemd-tmpfiles-setup runs before auditd loads the
# audit rules, so the canary directory exists by then for the canary watch rule (ADR 0017, point 2),
# which deploy/audit gains with the collector's range trials. No age: the store keeps its own cap (R5).
d /var/lib/balistid 0755 root root -
d /var/lib/balistid/collector 0700 balistid-collector balistid-collector -
d /var/lib/balistid/collector/store 0700 balistid-collector balistid-collector -
d /var/lib/balistid/collector/canary 0700 balistid-collector balistid-collector -
