# The collector's own uid, without privilege (ADR 0007). Laurel's _laurel comes with its package.
u balistid-collector - "Balistid Blue collector"
# auditd's log_group (deploy/auditd/auditd.conf), which reads its state file and audit.log. Only the collector's
# unit takes it, with auditstat's balistid-auditreport, as SupplementaryGroups (ADR 0038 point 2); no member.
g balistid-auditlog -
