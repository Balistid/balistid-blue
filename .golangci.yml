# Lint rules for ENGINEERING.md section 7 (ADR 0008). Changing this file needs the maintainer's review.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - wrapcheck
  settings:
    depguard:
      rules:
        forbidden:
          deny:
            - pkg: unsafe
              desc: "ENGINEERING.md 7: unsafe is forbidden"
            - pkg: math/rand
              desc: "ENGINEERING.md 7: use crypto/rand"
            - pkg: math/rand/v2
              desc: "ENGINEERING.md 7: use crypto/rand"
            - pkg: log
              desc: "ENGINEERING.md 7: use log/slog"
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: "ENGINEERING.md 7: return an error; panic only in main or tests"
        - pattern: ^print(ln)?$
          msg: "ENGINEERING.md 7: use log/slog"
        - pattern: ^context\.(Background|TODO)$
          msg: "ENGINEERING.md 7: take ctx from the caller; Background only in main and tests"
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo, wrapcheck]
formatters:
  enable:
    - gofmt
