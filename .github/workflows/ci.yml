name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue's group commit runs every job before it lands (ADR 0041).
  merge_group:
    types: [checks_requested]
  # Weekly on main, so govulncheck sees advisories published without a new commit.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
  GO_VERSION: "1.27.3"
  GO_SHA256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
  GOLANGCI_VERSION: "2.14.0"
  GOLANGCI_SHA256: "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
  GOVULNCHECK_VERSION: "v1.8.0"
  GOVULNCHECK_SUM: "h1:clG4qBU6zH5VKjti8n5j8BBuYzoSha392xXMkXS351U="
  # Mutation gate (ADR 0066): a small fork with fast releases, so one exact version and its module hash.
  MUTESTING_VERSION: "v2.10.40"
  MUTESTING_SUM: "h1:4H+N7GNOGA2//CWe3F2QBj6WVFKQYKFKLKODH/V/2pY="

jobs:
  go-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go (pinned by sha256) and check it against go.mod
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          python3 tools/ci/go_gate.py toolchain --go-mod go.mod \
            --goversion "$("$RUNNER_TEMP/go/bin/go" env GOVERSION)" --expect "$GO_VERSION"
      - name: Install golangci-lint (pinned by sha256)
        run: |
          gl="golangci-lint-${GOLANGCI_VERSION}-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/gl.tgz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/$gl.tar.gz"
          echo "$GOLANGCI_SHA256  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$gl" >> "$GITHUB_PATH"
      - name: Format, modules, vet, lint (no project code runs in this job)
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
          go mod tidy -diff
          go mod verify
          cgo_files="$(CGO_ENABLED=1 go list -buildvcs=false -f '{{join .CgoFiles " "}}' ./...)"
          test -z "${cgo_files//[[:space:]]/}" || { echo "cgo is forbidden (ADR 0003): $cgo_files"; exit 1; }
          go vet ./...
          GOARCH=arm64 go vet ./cmd/balistid-pi ./internal/watch  # the Pi's architecture (ADR 0031)
          golangci-lint run ./...
      - name: Every package of the range binaries, the runner, the client and the collector is code-owned (ADR 0011, 0015)
        run: |
          go list -deps -json ./cmd/balistid-range ./cmd/balistid-range-guest ./cmd/balistid-runner ./cmd/balistid ./cmd/balistid-collector ./cmd/balistid-ledger ./cmd/balistid-relay ./cmd/balistid-pi ./cmd/balistid-auditstat ./cmd/balistid-install > "$RUNNER_TEMP/deps.json"
          python3 tools/ci/go_gate.py owned --deps "$RUNNER_TEMP/deps.json" \
            --codeowners .github/CODEOWNERS --go-mod go.mod
      - name: Known vulnerabilities (govulncheck module checked against its pinned hash first)
        run: |
          (cd "$RUNNER_TEMP" && go mod download -json "golang.org/x/vuln@${GOVULNCHECK_VERSION}") > "$RUNNER_TEMP/vuln.json"
          python3 tools/ci/go_gate.py modsum --json "$RUNNER_TEMP/vuln.json" --expect "$GOVULNCHECK_SUM"
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -C range/witness \
            filippo.io/torchwood/cmd/litewitness filippo.io/torchwood/cmd/witnessctl

  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go (pinned by sha256) and check it against go.mod
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          python3 tools/ci/go_gate.py toolchain --go-mod go.mod \
            --goversion "$("$RUNNER_TEMP/go/bin/go" env GOVERSION)" --expect "$GO_VERSION"
      - name: Build and test as released (no cgo)
        env:
          BALISTID_REQUIRE_SECCOMP_TEST: "1" # the tick tripwire's seccomp test must run, not skip
        run: |
          go build ./...
          go test ./...

  mutation:
    # A mutant on a changed line of a security-decision package that a test runs but no test kills fails the
    # pull request (ADR 0066); uncovered mutants are listed in the job's log for review.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go (pinned by sha256) and check it against go.mod
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          python3 tools/ci/go_gate.py toolchain --go-mod go.mod \
            --goversion "$("$RUNNER_TEMP/go/bin/go" env GOVERSION)" --expect "$GO_VERSION"
      - name: Install go-mutesting (module checked against its pinned hash first)
        run: |
          (cd "$RUNNER_TEMP" && go mod download -json "github.com/jonbaldie/go-mutesting/v2@${MUTESTING_VERSION}") > "$RUNNER_TEMP/mutesting.json"
          python3 tools/ci/go_gate.py modsum --json "$RUNNER_TEMP/mutesting.json" --expect "$MUTESTING_SUM"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/jonbaldie/go-mutesting/v2/cmd/go-mutesting@${MUTESTING_VERSION}"
      - name: Mutants on changed security-decision code must die
        run: |
          "$RUNNER_TEMP/bin/go-mutesting" --workers=2 --exec-timeout=120 --per-test --coverage --no-diffs \
            --output-statuses=enx --logger-github --blacklist=tools/ci/mutation-blacklist \
            --baseline="$RUNNER_TEMP/no-baseline.json" \
            --git-diff-lines --git-diff-base="$BASE_SHA" --fail-on-escaped \
            ./internal/anchor/ ./internal/unixsock/ ./internal/cosign/ ./internal/link/ ./internal/collector/ \
            ./internal/rangevm/ ./internal/relay/ ./internal/entry/ ./internal/shard/ ./internal/store/ ./internal/watch/ \
            ./cmd/balistid-ledger/

  go-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go (pinned by sha256) and check it against go.mod
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          python3 tools/ci/go_gate.py toolchain --go-mod go.mod \
            --goversion "$("$RUNNER_TEMP/go/bin/go" env GOVERSION)" --expect "$GO_VERSION"
      - name: Tests with the race detector (needs cgo)
        env:
          BALISTID_REQUIRE_SECCOMP_TEST: "1" # the tick tripwire's seccomp test must run, not skip
        run: CGO_ENABLED=1 go test -race ./...

  go-release:
    needs: [go-static, go-test, go-race, selftest, docs-budget, pin-check, commit-lint, secrets, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go (pinned by sha256) and check it against go.mod
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          python3 tools/ci/go_gate.py toolchain --go-mod go.mod \
            --goversion "$("$RUNNER_TEMP/go/bin/go" env GOVERSION)" --expect "$GO_VERSION"
      - name: Reproducible release build (no built binary runs in this job)
        run: |
          flags="-X github.com/Balistid/balistid-blue/internal/buildinfo.Version=${GITHUB_SHA}"
          a="$RUNNER_TEMP/build-a" b="$RUNNER_TEMP/other/build-b"
          mkdir -p "$a" "$b" "$RUNNER_TEMP/home-b" "$RUNNER_TEMP/tmp-b"
          git archive HEAD | tar -x -C "$a"
          git archive HEAD | tar -x -C "$b"
          # balistid-pi runs on the maintainer's arm64 Pi, installed by the hash printed below (ADR 0031).
          for target in balistid:amd64 balistid-auditstat:amd64 balistid-collector:amd64 balistid-ledger:amd64 \
            balistid-runner:amd64 balistid-install:amd64 balistid-pi:arm64; do
            cmd="${target%:*}" arch="${target#*:}"
            (cd "$a" && GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "$flags" -o "$cmd" "./cmd/$cmd")
            (cd "$b" && umask 077 && HOME="$RUNNER_TEMP/home-b" TMPDIR="$RUNNER_TEMP/tmp-b" \
              GOPATH="$RUNNER_TEMP/gopath-b" GOCACHE="$RUNNER_TEMP/cache-b" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags "$flags" -o "$cmd" "./cmd/$cmd")
          done
          # No built binary runs in this job: one run here could change what is bundled before it is
          # hashed. test_release.py checks the -X path names the real variable (it is ignored silently).
          for cmd in balistid balistid-auditstat balistid-collector balistid-ledger balistid-runner balistid-install \
            balistid-pi; do
            python3 tools/ci/go_gate.py same "$a/$cmd" "$b/$cmd"
            sha256sum "$a/$cmd"
          done
          for c in recorder runner; do
            python3 tools/ci/release.py manifest --component "$c" --bin "$a" --tree "$a" \
              --signers "$a/deploy/install/allowed_signers" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/files-$c"
            mkdir "$RUNNER_TEMP/$c"
            python3 tools/ci/release.py bundle --dir "$RUNNER_TEMP/files-$c" --out "$RUNNER_TEMP/$c/balistid-$c-bundle.tar"
            cp "$RUNNER_TEMP/files-$c/MANIFEST" "$RUNNER_TEMP/$c/MANIFEST"
          done
      # The maintainer signs a MANIFEST only if it equals the one this step prints on a push to main (ADR 0058,
      # point 1). A pull request runs its own workflow and can print anything, so the main workflow prints nothing there.
      - name: MANIFESTs of the recorder and the range runner, and the first-install command
        if: github.event_name == 'push'
        run: |
          for c in recorder runner; do
            echo "MANIFEST of the $c at $GITHUB_SHA:"
            cat "$RUNNER_TEMP/$c/MANIFEST"
          done
          python3 tools/ci/release.py bootstrap --signers deploy/install/allowed_signers
      # The maintainer downloads one, signs its MANIFEST and installs with balistid-install (ADR 0058, 0068).
      - name: Upload the recorder's bundle and its MANIFEST
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balistid-recorder-bundle
          path: |
            ${{ runner.temp }}/recorder/balistid-recorder-bundle.tar
            ${{ runner.temp }}/recorder/MANIFEST
          if-no-files-found: error
          retention-days: 30
      - name: Upload the runner's bundle and its MANIFEST
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balistid-runner-bundle
          path: |
            ${{ runner.temp }}/runner/balistid-runner-bundle.tar
            ${{ runner.temp }}/runner/MANIFEST
          if-no-files-found: error
          retention-days: 30

  selftest:
    runs-on: ubuntu-24.04
    # The bootstrap's every-dropped-character test runs about 4 000 variants: about 5 min on this runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned by sha256) for the pin-check gate tests
        run: |
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$tarball"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" zizmor
      - name: Install gitleaks (pinned by sha256) for the rescan detection test
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - run: >-
          ZIZMOR="$RUNNER_TEMP/zizmor" GITLEAKS="$RUNNER_TEMP/gitleaks"
          python3 -m unittest discover -s tools/ci/tests -v

  docs-budget:
    # A scheduled run has no commit range to check.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Layout and budget of the tree that lands and of every commit in the change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          range="$(python3 tools/ci/change_range.py)"
          python3 tools/ci/docs_budget.py
          python3 tools/ci/docs_budget.py --range "$range"
      - name: The retired project name stays out of the tree
        # The bracket keeps this line from matching itself. Only "no match" (exit 1) passes, so a fatal
        # git error fails the step; --text also searches files that are binary or marked binary.
        run: |
          rc=0; git grep -n -i --text 'k[o]rdon' || rc=$?
          test "$rc" -eq 1
          if git ls-files | grep -i 'k[o]rdon'; then exit 1; fi

  pin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned by sha256)
        run: |
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$tarball"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" zizmor
      - name: Audit workflows (hash-pinned actions and more)
        run: '"$RUNNER_TEMP/zizmor" --offline --config zizmor.yml .github/workflows/'

  commit-lint:
    # A scheduled run has no commit range to check.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint every commit in the change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        # A group's and a push's commits passed this lint on their pull request, author checked there.
        run: |
          range="$(python3 tools/ci/change_range.py)"
          set -- --range "$range"
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "merge_group" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            set -- "$@" --dependabot-pr
          fi
          python3 tools/ci/commit_lint.py "$@"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned by sha256)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        # Force text diffs so .gitattributes cannot hide files and ignore inline allow comments.
        # gitleaks still reads a committed .gitleaksignore; docs-budget rejects that path.
        run: |
          printf '* diff\n' > .git/info/attributes
          mkdir -p "$RUNNER_TEMP/no-ignore"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" .
      - name: Rescan files gitleaks skips, from every commit in history, with the repository rules
        run: |
          python3 tools/ci/rescan_skipped.py --range HEAD --gitleaks "$RUNNER_TEMP/gitleaks" \
            --config .gitleaks.toml

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned by sha256)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Install shellcheck (pinned by sha256)
        run: |
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - run: '"$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" githooks/*'

  # Advisory, not a required check (ADR 0028): evidence comes only from the local runner (ADR 0011).
  range-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the commit's range image and run its self-test on KVM
        run: python3 tools/ci/range_kvm.py --work "$RUNNER_TEMP/range"
