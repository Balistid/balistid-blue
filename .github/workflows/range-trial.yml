# One acceptance trial of the range on a GitHub-hosted runner's KVM, on request (ADR 0037): the run a session
# cannot make in its sandbox before review. Advisory, never evidence (ADR 0028, point 4). repository_dispatch runs
# this file as it is on main: its permissions and expressions are main's. The payload is checked first; the
# commit it names then runs as its pull request CI would, its range_kvm.py with sudo on the throwaway runner.
name: range-trial

on:
  repository_dispatch:
    types: [range-trial]

permissions:
  contents: read

jobs:
  range-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check the dispatched commit and trial
        env:
          SHA: ${{ github.event.client_payload.sha }}
          TRIAL: ${{ github.event.client_payload.trial }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TRIAL" =~ ^[a-z0-9-]{1,32}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Build the commit's range image and run one trial on KVM
        env:
          TRIAL: ${{ github.event.client_payload.trial }}
        run: python3 tools/ci/range_kvm.py --work "$RUNNER_TEMP/range" --trial "$TRIAL"
