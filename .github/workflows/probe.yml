name: probe

# Probes that need root and a real systemd run here, on a fresh runner, never on the maintainer's machine (T18).
# Every pull request and merge group runs probe_noexec.py, so it can be a required check (ADR 0041: a required
# check must listen to merge_group); workflow_dispatch runs any tools/ci/probe_*.py the same way.
# ubuntu-26.04 ships systemd 259; the probe refuses anything older than 258.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      probe:
        description: "A tools/ci/probe_*.py file name"
        required: true
        default: probe_noexec.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the units' users and groups
        run: sudo systemd-sysusers deploy/*/sysusers.conf
      - name: Run the probe as root
        env:
          PROBE: ${{ inputs.probe || 'probe_noexec.py' }}
        run: |
          [[ "$PROBE" =~ ^probe_[a-z0-9_]+\.py$ ]] || { echo "::error::not a tools/ci/probe_*.py file name: $PROBE"; exit 1; }
          sudo python3 -I "tools/ci/$PROBE"
