title = "balistid gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "host-home-path"
description = "Absolute home directory path; host-specific data must not be committed"
# Capture only the user name: the default global allowlist exempts secrets that look like a whole
# path (^/(?:home|...)/...), which would silently disable this rule.
regex = '''/(?:home|Users)/([A-Za-z0-9._-]+)'''
secretGroup = 1

[[rules.allowlists]]
description = "Generic placeholders and CI runner paths"
regexes = ['''^(?:runner|user|example)$''']

# The secrets job rescans go.sum as n.gosum.txt, where generic-api-key reads "token v1.1.0 h1:<hash>" of a
# module path as a key. Only a whole go.sum line with a dotted module path, only in such a copy, is let through.
[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)[0-9]+\.gosum\.txt$''']
regexTarget = "line"
regexes = ['''(?m)^[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:/[\w.~+-]+)* v[0-9][\w.+-]*(?:/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''']

# A runner result names its job's content by sha256 (ADR 0011), which generic-api-key reads as a key. Only that
# exact match, only in a window's result.json under lab/ (ADR 0077), is let through, for that rule. The id is the
# layout gate's (docs_budget.WINDOW_ID); a test compares the two.
[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^lab/windows/[0-9]{8}t[0-9]{6}z-[0-9a-f]{8}-[a-z0-9][a-z0-9-]{0,63}/result\.json$''']
regexTarget = "match"
regexes = ['''^content_key": "[0-9a-f]{64}"$''']
