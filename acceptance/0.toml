# Acceptance numbers for floor 0 (recorder). Written before code (R3); only the maintainer changes a
# number, through an ADR. A missed metric blocks deployment. Each metric names its threat rows
# (THREAT_MODEL.md), its ADR and how it is measured. A measurement that cannot run is a miss, and a
# metric must fail on a broken system: every health check has a healthy run that must report OK.

[meta]
floor = 0
status = "approved"          # approved by the maintainer in pull request #10 (2026-10-01)
reference_host = "32 cores, 31 GiB RAM, NVMe SSD, kernel 7.2.x"

# --- Sensor and health (ADR 0004, 0007) ---

[[metric]]
id = "healthy_ok"
min = 99.9
unit = "% of 30 s samples reporting OK during seven days of normal use on the reference host, smoke-tested kernel"
rows = ["T26"]
adr = "0004"
method = "The seven days of loss_per_day (ADR 0018: not in the range, which a day-long run would hold), computed from the collector's health records; a result at the maintainer's uid is advisory (T33) and who computes the binding one is decided in 9.5; any UNKNOWN must carry a named reason and counts against the limit."

[[metric]]
id = "sensor_down_s"
max = 10
unit = "s from failure to SENSOR_DOWN or UNKNOWN"
rows = ["T25", "T26"]
adr = "0004"
method = "Range VM, 20 trials each: kill Laurel, stop auditd, start with rules that differ from the repository (injected before -e 2). Separately, auditctl -e 0 under -e 2 is refused and recorded."

[[metric]]
id = "canary_interval_s"
max = 30
unit = "s between canaries; two missed canaries set health UNKNOWN"
rows = ["T25"]
adr = "0004"
method = "A canary process makes an audited syscall that must come back through kernel, auditd and Laurel; the test drops canaries at each stage."

[[metric]]
id = "loss_per_day"
max = 0
unit = "records reported lost by the kernel, the auditd dispatcher or the collector (ADR 0016)"
rows = ["T4", "T25"]
adr = "0004"
method = "Seven days of normal use on the reference host."

[[metric]]
id = "reconnects_per_day"
max = 0
unit = "Laurel-to-collector reconnects outside restarts and shutdowns; a manual SIGHUP to Laurel counts as one (ADR 0017)"
rows = ["T25"]
adr = "0004"
method = "Seven days of normal use; each reconnect is an event because the records it lost cannot be counted."

# --- Throughput, durability, input limits (ADR 0005, 0007) ---

[[metric]]
id = "sustained_rate"
min = 2000
unit = "records/s for 600 s with zero loss"
rows = ["T4"]
adr = "0005"
method = "Range VM generator gives every exec a sequence number in argv; read from the collector's store (Laurel-only runs are a baseline and never pass), every number is stored once and none outside the generated set, audit lost is unchanged, no dispatcher overflow, the rate holds in every 10 s window, where a number emitted at most 100 ms after the end of the window it was due in still counts there (scheduler jitter, at most 1 % of a window; ADR 0019); guest steal over 1 % under load or while the reader drains is INVALID (ADR 0018)."

[[metric]]
id = "burst_rate"
min = 10000
unit = "records/s for 10 s with zero loss"
rows = ["T4"]
adr = "0005"
method = "As sustained_rate, on top of an idle baseline, with the number as the address of ptrace(PEEKDATA) of no process (ADR 0018)."

[[metric]]
id = "crash_loss_ms"
max = 1000
unit = "ms of records handed over but not yet committed"
rows = ["T24"]
adr = "0005"
method = "20 trials each of kill -9 of the collector and a guest reset (sysrq b; ADR 0018: the host stamps the failure within 100 ms of the guest's last mark, the store's ext4 must need recovery, a device's volatile write cache is not modelled) at sustained_rate. Every record whose commit was acknowledged must survive; only records handed over within the limit before the failure may be lost."

[[metric]]
id = "record_max_kib"
max = 2048
unit = "KiB per stored record (ARG_MAX at the default 8 MiB stack); larger records are stored truncated (head, tail, original length, SHA-256) and counted in health"
rows = ["T20"]
adr = "0007"
method = "Test runs execs with 131 KB (xargs) and 2 MB argv: stored whole, no alarm; raises the stack limit and runs a 6 MB argv: truncated, counted; feeds malformed records: stored and counted malformed (ADR 0016)."

[[metric]]
id = "truncation_alarm_per_hour"
max = 10
unit = "truncated records per hour above which the Pi alerts"
rows = ["T8", "T20"]
adr = "0006"
method = "Run 11 oversized execs within an hour: one alert; run 10: none."

[[metric]]
id = "fuzz_hours"
min = 1
unit = "hours of Go fuzzing per parser (collector, ledger, normalizer, sockets) without a crash"
rows = ["T18", "T19", "T20"]
adr = "0007"
method = "go test -fuzz in a scheduled CI workflow on main (ADR 0016); only a commit it fuzzed is installed; crashers committed as seeds in testdata/*.jsonl."

[[metric]]
id = "rss_mib"
max = 512
unit = "MiB, all Balistid Blue processes at 1000 records/s, at burst_rate with 64 KiB records, and at 50 execs/s with 2048 KiB records"
rows = ["T20"]
adr = "0007"
method = "Maximum summed RSS from /proc over each run."

[[metric]]
id = "cpu_cores"
max = 0.5
unit = "cores, all Balistid Blue processes at 1000 records/s"
rows = ["T20"]
adr = "0007"
method = "On the reference host after the install (ADR 0025): CPU time of every Balistid Blue unit on the host (the collector's, auditd's with Laurel, balistid-auditstat's and every other installed floor-0 unit) from before 600 s of 1000 numbered execs a second until the audit backlog is empty and commits stop for 3 s, divided by 600 s; a rate not held in any 10 s window, a lost record or a restarted unit is INVALID. Who computes the binding result is decided in 9.5, as for healthy_ok (T33). The range's cpu-1000 is a trend and never decides it."

# --- Store lifecycle (ADR 0005, R5) ---

[[metric]]
id = "raw_retention_days"
value = 30
unit = "days before a sealed, cosigned shard is deleted"
rows = ["T22"]
adr = "0005"
method = "Lifecycle test with fake clocks: age is the latest witness cosignature time minus the shard seal's cosignature time, and the host's clock must also be as far past the seal; the host clock alone never retires a shard (ADR 0029)."

[[metric]]
id = "raw_cap_gib"
max = 150
unit = "GiB of raw shards; at the cap new records are dropped with a loss entry"
rows = ["T4"]
adr = "0005"
method = "Fill test. Stored shards are never evicted; the maintainer can expire shards through balistid-install."

[[metric]]
id = "capacity_margin"
min = 3
unit = "raw_cap_gib divided by (raw_retention_days x measured baseline GiB per day)"
rows = ["T4"]
adr = "0005"
method = "Baseline bytes per day measured over seven days of normal use; below the margin the numbers must be revised before deployment."

[[metric]]
id = "headroom_gib"
min = 2
unit = "GiB physically reserved outside raw_cap_gib for loss and health records"
rows = ["T4", "T10"]
adr = "0005"
method = "Reserve file allocated at the size (stat st_blocks). Fill the filesystem and the raw cap: at least 10000 loss and health entries are still written; exhausting the reserve sets UNKNOWN and alarms."

[[metric]]
id = "shard_max_gib"
max = 2
unit = "GiB per shard before an early seal"
rows = ["T20"]
adr = "0005"
method = "Fill test seals at the limit."

[[metric]]
id = "derived_cap_gib"
max = 20
unit = "GiB of derived database, 30 days retention"
rows = ["T20"]
adr = "0005"
method = "Lifecycle and fill test on the derived database."

[[metric]]
id = "host_log_cap_gib"
max = 10
unit = "GiB of Tessera tiles and ledger state on the host per yearly log"
rows = ["T20"]
adr = "0006"
method = "Fill test; reaching the cap sets UNKNOWN and alarms."

[[metric]]
id = "refusal_summary_s"
max = 60
unit = "s per refusal summary record (count per socket and reason, rule version, one sample) in the raw store"
rows = ["T20"]
adr = "0007"
method = "Test floods every collector socket with invalid requests (the ledger sums its refusals in its journal, ADR 0027): every minute with refusals has one summary record, stored at most two collector ticks (500 ms) after the minute (ADR 0023); nothing else grows (Laurel's socket stores malformed lines as evidence, ADR 0016)."

# --- Anchoring and the Pi (ADR 0006) ---

[[metric]]
id = "anchor_interval_s"
max = 1
unit = "s between batch entries while recording"
rows = ["T13"]
adr = "0006"
method = "Maximum gap between log entries over a 1 h run."

[[metric]]
id = "cosign_gap_s"
max = 60
unit = "s, maximum gap between cosigned checkpoints while host and Pi are connected"
rows = ["T13"]
adr = "0006"
method = "Maximum (not a percentile) over a 24 h run with host and Pi connected."

[[metric]]
id = "loss_alarm_s"
max = 120
unit = "s from injected kernel, dispatcher or collector loss, or a health failure, to a phone alert"
rows = ["T4", "T25"]
adr = "0006"
method = "Inject transient kernel loss followed by OK, sustained loss and dispatcher overflow; each alerts within the limit, 10 trials; so do a full collector queue and a failing store (ADR 0016). balistid-auditstat polls at most every 5 s."

[[metric]]
id = "silence_alarm_s"
max = 900
unit = "s of unannounced silence (no cosigned checkpoint) before a phone alert"
rows = ["T13", "T28"]
adr = "0006"
method = "Cut WireGuard, kill the ledger, power off the VM without announcement: each alerts within the limit. Announced shutdown and suspend stay quiet only up to announced_quiet_max_h."

[[metric]]
id = "announced_quiet_max_h"
max = 24
unit = "hours the Pi stays quiet after a shutdown or suspend announcement"
rows = ["T14", "T28"]
adr = "0006"
method = "Announce, then stay off; announce, reboot with the ledger down; return briefly and announce again within 1 h (the cap does not restart): each alerts at the limit."

[[metric]]
id = "verify_freshness_s"
max = 3600
unit = "s since the last successful scheduled verification on the Pi"
rows = ["T12"]
adr = "0006"
method = "Stop the scheduler or make verification fail: an alert follows within the limit."

[[metric]]
id = "verify_s"
max = 5
unit = "s for one verification of a day of log growth"
rows = ["T12"]
adr = "0006"
method = "Pi run on a log grown by one day at sustained_rate."

[[metric]]
id = "log_retention_days"
value = 400
unit = "days of tiles and checkpoints kept, on host and Pi"
rows = ["T12", "T17"]
adr = "0006"
method = "Lifecycle test with yearly rollover and a fake clock."

[[metric]]
id = "pi_store_cap_gib"
max = 24
unit = "GiB for checkpoints, mirrored tiles and witness state on the Pi (two yearly logs at host_log_cap_gib plus margin)"
rows = ["T16"]
adr = "0006"
method = "Fill test on the Pi image; reaching the cap alerts."

# --- Process isolation (ADR 0007) ---

[[metric]]
id = "systemd_exposure"
max = 2.5
unit = "systemd-analyze security score, every unit except balistid-auditstat"
rows = ["T18"]
adr = "0007"
method = "systemd-analyze security on the installed units in the range VM: exactly the recorder's services, pinned in the trial judge; the range runner's host units are range infrastructure, not floor 0 (ADR 0023)."

[[metric]]
id = "systemd_exposure_auditstat"
max = 4.0
unit = "systemd-analyze security score for balistid-auditstat"
rows = ["T18"]
adr = "0007"
method = "As above."

[[metric]]
id = "ready_s"
max = 30
unit = "s from boot to health OK on a smoke-tested kernel"
rows = ["T26"]
adr = "0007"
method = "Range VM boot, 10 trials; UNKNOWN is a miss unless the kernel is untested, and then it must name that reason."

# --- Range runner (ADR 0011; proposed with it, approved by the maintainer when it merges) ---

[[metric]]
id = "runner_build_memory_gib"
max = 3
unit = "GiB MemoryMax, no swap, of the unit that builds the runner's image at install"
rows = ["T36"]
adr = "0011"
method = "The build of the installed commit passes under the cap (peak 2 GiB measured 2026-10-04). A probe unit with the same properties that allocates past the cap ends with Result=oom-kill, and journalctl -k shows no OOM kill outside that unit."

[[metric]]
id = "runner_job_memory_gib"
max = 2.5
unit = "GiB MemoryMax, no swap, of each job unit (the guest has 2048 MiB)"
rows = ["T36"]
adr = "0011"
method = "20 runs of the runner's own image pass under the cap (peak 1.6 GiB measured 2026-10-04), and an exec job that touches all guest memory stays under it. The over-cap probe is as for the build: Result=oom-kill, no OOM kill outside the unit, and the job is INVALID."
