# Acceptance numbers for floor 0 (recorder). Written before code (R3); only the maintainer changes a
# number, through an ADR. A missed metric blocks deployment. Each metric names its threat rows
# (THREAT_MODEL.md), its ADR and how it is measured. A measurement that cannot run is a miss, and a
# metric must fail on a broken system: every health check has a healthy run that must report OK.

[meta]
floor = 0
status = "proposed"          # "approved" once the maintainer approves the pull request
reference_host = "32 cores, 31 GiB RAM, NVMe SSD, kernel 7.2.x"

# --- Sensor and health (ADR 0004, 0007) ---

[[metric]]
id = "healthy_ok"
min = 99.9
unit = "% of 30 s samples reporting OK during a 24 h healthy run on a smoke-tested kernel"
rows = ["T26"]
adr = "0004"
method = "Range VM, normal synthetic workload; any UNKNOWN must carry a named reason and counts against the limit."

[[metric]]
id = "sensor_down_s"
max = 10
unit = "s from failure to SENSOR_DOWN or UNKNOWN"
rows = ["T25", "T26"]
adr = "0004"
method = "Range VM, 20 trials each: kill Laurel, stop auditd, start with rules that differ from the repository (injected before -e 2). Separately, auditctl -e 0 under -e 2 is refused and recorded."

[[metric]]
id = "canary_interval_s"
max = 30
unit = "s between canaries; two missed canaries set health UNKNOWN"
rows = ["T25"]
adr = "0004"
method = "A canary process makes an audited syscall that must come back through kernel, auditd and Laurel; the test drops canaries at each stage."

[[metric]]
id = "loss_per_day"
max = 0
unit = "records reported lost by the kernel or the auditd dispatcher"
rows = ["T4", "T25"]
adr = "0004"
method = "Seven days of normal use on the reference host."

[[metric]]
id = "reconnects_per_day"
max = 0
unit = "Laurel-to-collector reconnects outside restarts and shutdowns"
rows = ["T25"]
adr = "0004"
method = "Seven days of normal use; each reconnect is an event because the records it lost cannot be counted."

# --- Throughput, durability, input limits (ADR 0005, 0007) ---

[[metric]]
id = "sustained_rate"
min = 2000
unit = "records/s for 600 s with zero loss"
rows = ["T4"]
adr = "0005"
method = "Range VM generator embeds a unique token in every event; the set of tokens stored must equal the set generated."

[[metric]]
id = "burst_rate"
min = 10000
unit = "records/s for 10 s with zero loss"
rows = ["T4"]
adr = "0005"
method = "As sustained_rate, on top of an idle baseline."

[[metric]]
id = "crash_loss_ms"
max = 1000
unit = "ms of records handed over but not yet committed"
rows = ["T24"]
adr = "0005"
method = "20 trials each of kill -9 of the collector and a hard VM reset (cache=none) at sustained_rate. Every record whose commit was acknowledged must survive; only records handed over within the limit before the failure may be lost."

[[metric]]
id = "record_max_kib"
max = 64
unit = "KiB per stored record; larger records are stored truncated (head, tail, original length, SHA-256) with a truncation entry"
rows = ["T20"]
adr = "0007"
method = "Test runs an exec with a 70 KB argv and feeds malformed records: the exec is stored truncated and alarms like loss; malformed records become loss entries."

[[metric]]
id = "fuzz_hours"
min = 1
unit = "hours of Go fuzzing per parser (collector, ledger, normalizer, sockets) without a crash"
rows = ["T18", "T19", "T20"]
adr = "0007"
method = "go test -fuzz in CI or the range; corpus committed under testdata."

[[metric]]
id = "rss_mib"
max = 512
unit = "MiB, all Kordon processes at 1000 records/s and at burst with 64 KiB records"
rows = ["T20"]
adr = "0007"
method = "Maximum summed RSS from /proc over each run."

[[metric]]
id = "cpu_cores"
max = 0.5
unit = "cores, all Kordon processes at 1000 records/s"
rows = ["T20"]
adr = "0007"
method = "CPU time over a 10 min run divided by wall time."

# --- Store lifecycle (ADR 0005, R5) ---

[[metric]]
id = "raw_retention_days"
value = 30
unit = "days before a sealed, cosigned shard is deleted"
rows = ["T22"]
adr = "0005"
method = "Lifecycle test with a fake clock: age is the latest witness cosignature time minus the shard seal's cosignature time; the host clock is never used."

[[metric]]
id = "raw_cap_gib"
max = 150
unit = "GiB of raw shards; at the cap new records are dropped with a loss entry"
rows = ["T4"]
adr = "0005"
method = "Fill test. Stored shards are never evicted; the maintainer can expire shards through kordon-install."

[[metric]]
id = "capacity_margin"
min = 3
unit = "raw_cap_gib divided by (raw_retention_days x measured baseline GiB per day)"
rows = ["T4"]
adr = "0005"
method = "Baseline bytes per day measured over seven days of normal use; below the margin the numbers must be revised before deployment."

[[metric]]
id = "headroom_gib"
min = 2
unit = "GiB physically reserved outside raw_cap_gib for loss and health records"
rows = ["T4", "T10"]
adr = "0005"
method = "Reserve file allocated at the size (stat st_blocks). Fill the filesystem and the raw cap: at least 10000 loss and health entries are still written; exhausting the reserve sets UNKNOWN and alarms."

[[metric]]
id = "shard_max_gib"
max = 2
unit = "GiB per shard before an early seal"
rows = ["T20"]
adr = "0005"
method = "Fill test seals at the limit."

[[metric]]
id = "derived_cap_gib"
max = 20
unit = "GiB of derived database, 30 days retention"
rows = ["T20"]
adr = "0005"
method = "Lifecycle and fill test on the derived database."

[[metric]]
id = "host_log_cap_gib"
max = 10
unit = "GiB of Tessera tiles and ledger state on the host per yearly log"
rows = ["T20"]
adr = "0006"
method = "Fill test; reaching the cap sets UNKNOWN and alarms."

[[metric]]
id = "refusal_summary_s"
max = 60
unit = "s per refusal summary record (count per socket and one sample) in the raw store"
rows = ["T20"]
adr = "0007"
method = "Test floods every socket with invalid requests: every minute with refusals has one summary record; nothing else grows."

# --- Anchoring and the Pi (ADR 0006) ---

[[metric]]
id = "anchor_interval_s"
max = 1
unit = "s between batch entries while recording"
rows = ["T13"]
adr = "0006"
method = "Maximum gap between log entries over a 1 h run."

[[metric]]
id = "cosign_gap_s"
max = 60
unit = "s, maximum gap between cosigned checkpoints while host and Pi are connected"
rows = ["T13"]
adr = "0006"
method = "Maximum (not a percentile) over a 24 h run with host and Pi connected."

[[metric]]
id = "loss_alarm_s"
max = 120
unit = "s from injected kernel or dispatcher loss, or a health failure, to a phone alert"
rows = ["T4", "T25"]
adr = "0006"
method = "Inject transient kernel loss followed by OK, sustained loss and dispatcher overflow; each alerts within the limit, 10 trials. kordon-auditstat polls at most every 5 s."

[[metric]]
id = "silence_alarm_s"
max = 900
unit = "s of unannounced silence (no cosigned checkpoint) before a phone alert"
rows = ["T13", "T28"]
adr = "0006"
method = "Cut WireGuard, kill the ledger, power off the VM without announcement: each alerts within the limit. Announced shutdown and suspend stay quiet only up to announced_quiet_max_h."

[[metric]]
id = "announced_quiet_max_h"
max = 24
unit = "hours the Pi stays quiet after a shutdown or suspend announcement"
rows = ["T14", "T28"]
adr = "0006"
method = "Announce, then stay off; and announce, reboot with the ledger down: both alert at the limit."

[[metric]]
id = "verify_freshness_s"
max = 3600
unit = "s since the last successful scheduled verification on the Pi"
rows = ["T12"]
adr = "0006"
method = "Stop the scheduler or make verification fail: an alert follows within the limit."

[[metric]]
id = "verify_s"
max = 5
unit = "s for one verification of a day of log growth"
rows = ["T12"]
adr = "0006"
method = "Pi run on a log grown by one day at sustained_rate."

[[metric]]
id = "log_retention_days"
value = 400
unit = "days of tiles and checkpoints kept, on host and Pi"
rows = ["T12", "T17"]
adr = "0006"
method = "Lifecycle test with yearly rollover and a fake clock."

[[metric]]
id = "pi_store_cap_gib"
max = 24
unit = "GiB for checkpoints, mirrored tiles and witness state on the Pi (two yearly logs at host_log_cap_gib plus margin)"
rows = ["T16"]
adr = "0006"
method = "Fill test on the Pi image; reaching the cap alerts."

# --- Process isolation (ADR 0007) ---

[[metric]]
id = "systemd_exposure"
max = 2.5
unit = "systemd-analyze security score, every unit except kordon-auditstat"
rows = ["T18"]
adr = "0007"
method = "systemd-analyze security on the installed units in the range VM."

[[metric]]
id = "systemd_exposure_auditstat"
max = 4.0
unit = "systemd-analyze security score for kordon-auditstat"
rows = ["T18"]
adr = "0007"
method = "As above."

[[metric]]
id = "ready_s"
max = 30
unit = "s from boot to health OK on a smoke-tested kernel"
rows = ["T26"]
adr = "0007"
method = "Range VM boot, 10 trials; UNKNOWN is a miss unless the kernel is untested, and then it must name that reason."
